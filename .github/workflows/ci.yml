name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creators_migration_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creators_migration_review"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CREATORS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creators_migration_review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
